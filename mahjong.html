<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(145deg,#1a3a2a,#0a1a0f);min-height:100vh;font-family:system-ui,'PingFang SC','Noto Sans CJK SC',sans-serif;padding:8px}
.game-container{max-width:1200px;margin:0 auto;background:rgba(30,25,20,.65);border-radius:28px;padding:10px;box-shadow:0 10px 40px rgba(0,0,0,.4)}

h1{text-align:center;font-size:clamp(.9rem,3vw,1.2rem);color:#f7e05e;margin-bottom:4px;line-height:1.2}

.example-word:active{transform:scale(.97)}

.notebook-actions{display:flex;gap:8px;justify-content:center}

.notebook-btn{background:linear-gradient(135deg,#2ecc71,#27ae60);border:none;padding:8px 18px;font-size:.75rem;font-weight:bold;border-radius:50px;cursor:pointer;color:#fff}
.speed-bonus{position:fixed;pointer-events:none;z-index:3000;font-size:1.4rem;font-weight:900;color:#f7b42c;text-shadow:0 2px 8px rgba(0,0,0,.5);animation:floatUpBonus 1.2s ease-out forwards}

<body>
<div class="game-container">
  <div class="nav-buttons">
    <a href="index.html" class="back-btn">◀ Главная</a>
    <a href="copybook.html" class="back-btn">✍️ Тетрадь</a>
  </div>
  <h1>🀄️ МАДЖОНГ · КЛЮЧ → СЛОВО</h1>
  <div class="sub">Соедини ключ (🔑 радикал) со словом (📖), в котором он есть</div>
  <div class="db-status" id="dbStatus">📡 Загрузка базы...</div>

  <div class="level-bar-wrapper">
    <div class="level-bar" id="levelBar">
      <button class="level-btn" data-level="hsk1">🅰️ HSK1</button>
      <button class="level-btn" data-level="hsk2">🅰️ HSK2</button>
      <button class="level-btn" data-level="hsk3">🅰️ HSK3</button>
      <button class="level-btn" data-level="hsk4">🅰️ HSK4</button>
      <button class="level-btn" data-level="hsk5">🅰️ HSK5</button>
      <button class="level-btn active" data-level="hsk6">🅰️ HSK6</button>
      <button class="level-btn" data-level="hsk6_chars">🈶 HSK6-чары</button>
      <button class="level-btn" data-level="all">🏆 ВСЕ</button>
    </div>
  </div>

  <div class="stats-bar">
    <span>🎯 <span id="scoreValue">0</span></span>
    <span>🧩 <span id="remainValue">0</span></span>
    <span>🔥 <span id="streakValue">0</span></span>
    <span>⏱️ <span id="timerValue">0:00</span></span>
    <span>🏆 <span id="recordValue">0</span></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="message-area" id="gameMessage">🌟 Нажми на ключ, затем на слово</div>

  <div class="game-grid" id="gameGrid"></div>

  <div class="ctrl-buttons">
    <button id="hintBtn" class="hint-btn">💡 Подсказка</button>
    <button id="shuffleBtn" class="shuffle-btn">🔄 Перемешать</button>
    <button id="resetGameBtn" class="reset-btn">🆕 Новая игра</button>
  </div>
</div>

<script>
/* ===== КОНФИГ ===== */
const NOTEBOOK_CONFIG={canvasSize:420,gridPadding:28,defaultBrushWidth:14,minBrushWidth:4,maxBrushWidth:30,exampleOpacity:0.45,gridColor:'#b8956a',gridColorCenter:'#d4b896',strokeColor:'#1a0f0a',exampleColor:'#9b59b6',checkThreshold:0.40,checkGoodThreshold:0.25};

/* ===== СКЛЕЙКА CHAR_RADICAL ===== */
const CHAR_RADICAL = Object.assign(
  {},
  window.CHAR_RADICAL_HSK12 || {},
  window.CHAR_RADICAL_HSK34 || {},
  window.CHAR_RADICAL_HSK56 || {}
);
const RADICAL_INFO = window.RADICAL_INFO || {};

function getKeyInfo(c){
  const info = RADICAL_INFO[c] || {};
  return { pinyin: info.pinyin || '', meaning: info.meaning || 'ключ' };
}

/* ===== ОЗВУЧКА ===== */
let chineseVoice=null;
function loadChineseVoice(){if(!window.speechSynthesis)return;const v=speechSynthesis.getVoices();chineseVoice=v.find(x=>x.lang.startsWith('zh'))||null}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadChineseVoice;setTimeout(loadChineseVoice,100)}
function speakChinese(text){
  if(!window.speechSynthesis||!text)return;
  if(['丶','丨','丿','乛','⺄','⺀','⺁','⺂'].includes(text))return;
  speechSynthesis.cancel();
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';u.rate=0.8;
    if(chineseVoice)u.voice=chineseVoice;
    speechSynthesis.speak(u);
  },40);
}

/* ===== ТЕТРАДЬ ===== */
function addToCopybookOnly(char,pinyin,meaning){
  if(!char)return false;
  let arr=[];
  try{arr=JSON.parse(localStorage.getItem('copybook_words')||'[]');if(!Array.isArray(arr))arr=[]}catch(e){arr=[]}
  if(arr.some(w=>w.char===char))return false;
  arr.unshift({char,pinyin,meaning,timestamp:Date.now()});
  localStorage.setItem('copybook_words',JSON.stringify(arr));
  return true;
}
function openCopybookWithWord(char,pinyin,meaning){
  localStorage.setItem('selected_character',JSON.stringify({char,pinyin,meaning}));
  window.location.href='copybook.html';
}
function showToast(m){
  const t=document.createElement('div');
  t.className='toast';t.textContent=m;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}

/* ===== ПАРЫ ИЗ HSK_DICT ===== */
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function getHskGroup(level){
  if(!window.HSK_DICT) return null;
  if(level==='hsk6_chars') return window.HSK_DICT.hsk6_chars || null;
  return window.HSK_DICT[level] || null;
}

function getAllPairsForLevel(level){
  const group = getHskGroup(level);
  if(!group || !Array.isArray(group.words)) return [];
  const out=[];
  const seen=new Set();
  for(const w of group.words){
    if(!w) continue;
    if(w.length !== 1) continue;         // только одиночные иероглифы
    if(seen.has(w)) continue;
    const keyChar = CHAR_RADICAL[w];
    if(!keyChar) continue;               // нет ключа — пропускаем
    if(keyChar === w) continue;          // ключ не должен совпадать со словом
    seen.add(w);
    const ki = getKeyInfo(keyChar);
    out.push({
      wordChar: w,
      wordPinyin: (group.pinyin && group.pinyin[w]) || '',
      wordMeaning: (group.ru && group.ru[w]) || '',
      keyChar,
      keyPinyin: ki.pinyin,
      keyMeaning: ki.meaning
    });
  }
  return out;
}

function getAllPairsForGame(){
  const LEVELS = ['hsk1','hsk2','hsk3','hsk4','hsk5','hsk6','hsk6_chars'];
  const seenWords = new Set();
  const out = [];
  for(const lv of LEVELS){
    for(const p of getAllPairsForLevel(lv)){
      if(seenWords.has(p.wordChar)) continue;
      seenWords.add(p.wordChar);
      out.push(p);
    }
  }
  return out;
}

/* ===== ПРИМЕРЫ (слова с тем же ключом) ===== */
function collectExamples(word, limit){
  const key = word.keyChar;
  const self = word.char;
  const out = [];
  const seen = new Set([self]);
  if(!window.HSK_DICT) return out;

  const ALL = ['hsk1','hsk2','hsk3','hsk4','hsk5','hsk6','hsk6_chars'];
  for(const lv of ALL){
    if(out.length >= limit) break;
    const g = getHskGroup(lv);
    if(!g || !Array.isArray(g.words)) continue;
    for(const ch of g.words){
      if(out.length >= limit) break;
      if(!ch || ch.length !== 1) continue;
      if(seen.has(ch)) continue;
      if(!ch.includes(key)) continue;
      if(ch === key) continue;
      if(CHAR_RADICAL[ch] !== key) continue;
      seen.add(ch);
      out.push({
        char: ch,
        pinyin: (g.pinyin && g.pinyin[ch]) || '',
        meaning: (g.ru && g.ru[ch]) || ''
      });
    }
  }
  return out;
}

/* ===== СОСТОЯНИЕ ===== */
let currentLevel='hsk6';
let tiles=[],selectedId=null;
let matchedCount=0,totalPairs=0,score=0,streak=0,record=0;
let gameStartTime=0,timerInterval=null,lastMatchTime=0;
let currentModal=null,hwWriterInstance=null;
let currentBrushWidth=NOTEBOOK_CONFIG.defaultBrushWidth;
let pendingWord=null;

const gridEl=document.getElementById('gameGrid');
const scoreSpan=document.getElementById('scoreValue');
const remainSpan=document.getElementById('remainValue');
const streakSpan=document.getElementById('streakValue');
const recordSpan=document.getElementById('recordValue');
const timerSpan=document.getElementById('timerValue');
const progressFill=document.getElementById('progressFill');
const msgEl=document.getElementById('gameMessage');
const dbStatus=document.getElementById('dbStatus');

/* ===== ТАЙМЕР / БОНУСЫ ===== */
function startTimer(){
  gameStartTime=Date.now();lastMatchTime=Date.now();
  if(timerInterval)clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    const e=Math.floor((Date.now()-gameStartTime)/1000);
    const m=Math.floor(e/60),s=e%60;
    if(timerSpan)timerSpan.textContent=`${m}:${s.toString().padStart(2,'0')}`;
  },1000);
}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
function calcSpeedBonus(){
  const now=Date.now(),diff=(now-lastMatchTime)/1000;
  lastMatchTime=now;
  let bonus=0,label='';
  if(diff<2){bonus=15;label='⚡+15'}
  else if(diff<4){bonus=10;label='🔥+10'}
  else if(diff<7){bonus=5;label='👍+5'}
  return{bonus,label};
}
function showFloatingBonus(text,x,y){
  if(!text)return;
  const el=document.createElement('div');
  el.className='speed-bonus';el.textContent=text;
  el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1300);
}

/* ===== CANVAS ===== */
function drawMiziGeGrid(ctx,size,padding){
  const inner=size-padding*2,center=size/2;
  ctx.lineWidth=2.5;ctx.strokeStyle=NOTEBOOK_CONFIG.gridColor;ctx.strokeRect(padding,padding,inner,inner);
  ctx.setLineDash([8,5]);ctx.lineWidth=1.3;ctx.strokeStyle=NOTEBOOK_CONFIG.gridColorCenter;
  ctx.beginPath();ctx.moveTo(center,padding);ctx.lineTo(center,size-padding);ctx.stroke();
  ctx.beginPath();ctx.moveTo(padding,center);ctx.lineTo(size-padding,center);ctx.stroke();
  ctx.setLineDash([4,4]);ctx.lineWidth=0.9;ctx.strokeStyle=NOTEBOOK_CONFIG.gridColor;
  ctx.beginPath();ctx.moveTo(padding,padding);ctx.lineTo(size-padding,size-padding);ctx.stroke();
  ctx.beginPath();ctx.moveTo(size-padding,padding);ctx.lineTo(padding,size-padding);ctx.stroke();
  ctx.setLineDash([]);
}
function initNotebookCanvas(canvas){
  const s=NOTEBOOK_CONFIG.canvasSize;canvas.width=canvas.height=s;
  canvas.style.cssText=`width:100%;max-width:${s}px;aspect-ratio:1/1;display:block;touch-action:none`;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#fffef9';ctx.fillRect(0,0,s,s);drawMiziGeGrid(ctx,s,NOTEBOOK_CONFIG.gridPadding);
  return ctx;
}
function showExampleOnCanvas(canvas,char){
  const ctx=canvas.getContext('2d'),s=NOTEBOOK_CONFIG.canvasSize,inner=s-NOTEBOOK_CONFIG.gridPadding*2;
  const draw=()=>{
    ctx.fillStyle='#fffef9';ctx.fillRect(0,0,s,s);drawMiziGeGrid(ctx,s,NOTEBOOK_CONFIG.gridPadding);
    ctx.save();ctx.globalAlpha=NOTEBOOK_CONFIG.exampleOpacity;ctx.fillStyle=NOTEBOOK_CONFIG.exampleColor;
    ctx.font=`400 ${Math.floor(inner*0.95)}px "Ma Shan Zheng","STKaiti",serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(char,s/2,s/2+(inner*0.03));ctx.restore();
    ctx.lineWidth=currentBrushWidth;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=1;
    canvas._refData=ctx.getImageData(0,0,s,s);
  };
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>{document.fonts.load(`400 48px "Ma Shan Zheng"`).then(draw).catch(draw)})}else{setTimeout(draw,500)}
}
function clearNotebookCanvas(canvas){
  const ctx=canvas.getContext('2d'),s=NOTEBOOK_CONFIG.canvasSize;
  ctx.fillStyle='#fffef9';ctx.fillRect(0,0,s,s);drawMiziGeGrid(ctx,s,NOTEBOOK_CONFIG.gridPadding);
  delete canvas._refData;canvas._drawn=false;
}
function checkQuality(canvas){
  if(!canvas._refData)return{score:0,msg:'Сначала покажи образец',color:'#95a5a6'};
  const ctx=canvas.getContext('2d'),s=NOTEBOOK_CONFIG.canvasSize,current=ctx.getImageData(0,0,s,s);
  const dRef=canvas._refData.data,dCur=current.data;
  let match=0,totalRef=0,userOutside=0;const th=235;
  for(let i=0;i<dRef.length;i+=4){
    const isRef=(dRef[i]<th||dRef[i+1]<th||dRef[i+2]<th);
    const isUser=(dCur[i]<th||dCur[i+1]<th||dCur[i+2]<th);
    if(isRef){totalRef++;if(isUser)match++}else if(isUser){userOutside++}
  }
  if(totalRef===0)return{score:0,msg:'Нет эталона',color:'#95a5a6'};
  const precision=match/totalRef,recall=totalRef>0?match/(totalRef+userOutside):0;
  const f1=2*(precision*recall)/(precision+recall+0.001),pct=Math.round(f1*100);
  if(f1>NOTEBOOK_CONFIG.checkThreshold)return{score:pct,msg:'🌟 Отлично!',color:'#2ecc71'};
  if(f1>NOTEBOOK_CONFIG.checkGoodThreshold)return{score:pct,msg:'👍 Хорошо!',color:'#f39c12'};
  return{score:pct,msg:'📝 Тренируйся ещё',color:'#e67e22'};
}
function setupCalligraphyBrush(canvas){
  const ctx=canvas.getContext('2d');
  let drawing=false,lastX,lastY,lastWidth,lastTime,strokeLen=0;
  function getPos(e){
    const rect=canvas.getBoundingClientRect();
    return{
      x:(e.clientX-rect.left)*canvas.width/rect.width,
      y:(e.clientY-rect.top)*canvas.height/rect.height,
      pressure:Math.max(0.1,e.pressure||0.5)
    };
  }
  function start(e){
    e.preventDefault();drawing=true;canvas._drawn=true;strokeLen=0;
    const p=getPos(e);lastX=p.x;lastY=p.y;lastTime=performance.now();
    lastWidth=currentBrushWidth*0.8;
    ctx.fillStyle=NOTEBOOK_CONFIG.strokeColor;ctx.shadowBlur=1.5;ctx.shadowColor=NOTEBOOK_CONFIG.strokeColor;
    ctx.beginPath();ctx.arc(p.x,p.y,lastWidth/2,0,Math.PI*2);ctx.fill();
  }
  function draw(e){
    if(!drawing)return;e.preventDefault();
    const p=getPos(e),now=performance.now(),dt=Math.max(1,now-lastTime);
    const dx=p.x-lastX,dy=p.y-lastY,dist=Math.hypot(dx,dy),speed=dist/dt;
    strokeLen+=dist;
    const base=currentBrushWidth,pF=0.3+p.pressure*0.7,sF=Math.max(0.15,1-(speed/1.2));
    let targetW=base*pF*sF;
    if(strokeLen<22)targetW*=(0.65+0.35*(strokeLen/22));
    targetW=Math.max(2.5,Math.min(base*1.8,targetW));
    const newW=lastWidth*0.7+targetW*0.3;
    ctx.save();ctx.fillStyle=NOTEBOOK_CONFIG.strokeColor;ctx.shadowBlur=0.6;ctx.shadowColor=NOTEBOOK_CONFIG.strokeColor;
    const steps=Math.max(1,Math.floor(dist/2));
    for(let i=1;i<=steps;i++){
      const t=i/steps,ix=lastX+dx*t,iy=lastY+dy*t,iw=lastWidth+(newW-lastWidth)*t;
      ctx.beginPath();ctx.arc(ix,iy,iw/2,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    lastX=p.x;lastY=p.y;lastWidth=newW;lastTime=now;
  }
  function stop(){if(!drawing)return;drawing=false}
  canvas.addEventListener('pointerdown',start);
  canvas.addEventListener('pointermove',draw);
  canvas.addEventListener('pointerup',stop);
  canvas.addEventListener('pointerleave',stop);
  canvas.addEventListener('pointercancel',stop);
}

/* ===== HANZI WRITER ===== */
function initHanziWriter(container,char){
  container.innerHTML='';if(hwWriterInstance)hwWriterInstance=null;
  const c = char.length>1 ? char[0] : char;
  try{
    hwWriterInstance=HanziWriter.create(container,c,{
      width:container.clientWidth||120,height:container.clientHeight||120,padding:10,
      showOutline:true,strokeAnimationSpeed:1,delayBetweenStrokes:400,
      showCharacter:false,highlightColor:'#c0392b',outlineColor:'#d4b896',drawingColor:'#1a0f0a'
    });
    setTimeout(()=>{if(hwWriterInstance)hwWriterInstance.animateCharacter()},300);
  }catch(e){
    container.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:'Ma Shan Zheng';font-size:60px;color:#c0392b">${c}</div>`;
  }
}

/* ===== МОДАЛКА ===== */
function showLearnModal(word,isNew){
  if(currentModal){currentModal.remove();currentModal=null}
  if(!word)return;
  const examples = collectExamples(word, 3);
  const renderChar = word.char.length>1 ? word.char[0] : word.char;

  const modal=document.createElement('div');modal.className='learn-modal';
  modal.innerHTML=`
    <div class="learn-card">
      <div class="radical-header">
        <div class="radical-big pulse" title="Озвучить">${renderChar}</div>
        <div class="radical-info">
          <div class="radical-name">${word.meaning||'слово'}</div>
          <div class="radical-pinyin">${word.pinyin||''}</div>
          <div class="radical-mean">${isNew?'✅ Добавлено в тетрадь!':'📖 Уже было в тетради'}${word.char.length>1?' · первый символ':''}</div>
        </div>
      </div>
      <div class="writer-section">
        <div class="hw-box" id="hwContainer"></div>
        <div class="writer-controls">
          <div class="stroke-label">Порядок черт</div>
          <button id="replayAnimBtn" style="background:linear-gradient(135deg,#e67e22,#d35400);color:#fff">▶ Анимация</button>
          <button id="nbShow" style="background:linear-gradient(135deg,#2980b9,#3498db);color:#fff">👁️ Образец</button>
          <button id="nbHide" style="display:none;background:linear-gradient(135deg,#2980b9,#3498db);color:#fff">🙈 Скрыть</button>
        </div>
      </div>
      <div class="draw-section">
        <div class="brush-controls">
          <div class="brush-slider-wrapper">
            <label>🖌️</label>
            <input type="range" id="brushSlider" min="${NOTEBOOK_CONFIG.minBrushWidth}" max="${NOTEBOOK_CONFIG.maxBrushWidth}" value="${currentBrushWidth}" step="1">
            <div class="brush-preview" id="brushPreview" style="width:${currentBrushWidth}px;height:${currentBrushWidth}px"></div>
          </div>
        </div>
        <div class="draw-canvas-container"><canvas class="draw-canvas" id="nbCanvas"></canvas></div>
        <div class="quality-bar"><div class="quality-fill" id="qFill"></div></div>
        <div class="quality-text" id="qText">Нарисуй что-нибудь</div>
        <div class="draw-tools">
          <button class="clear-draw" id="nbClear">🧽 Очистить</button>
          <button id="nbCheck" style="background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff">✅ Проверить</button>
        </div>
      </div>
      ${examples.length>0?`<div class="examples-row">${examples.map(w=>`<div class="example-word" data-char="${w.char}"><div class="ex-char">${w.char}</div><div class="ex-pinyin">${w.pinyin}</div><div class="ex-mean">${w.meaning}</div></div>`).join('')}</div>`:''}
      <div class="notebook-actions">
        <button class="close-learn" id="nbClose">✖ Закрыть</button>
        <button class="notebook-btn" id="nbAdd">📓 В тетрадь</button>
      </div>
    </div>`;
  document.body.appendChild(modal);currentModal=modal;

  initHanziWriter(modal.querySelector('#hwContainer'),word.char);
  modal.querySelector('#replayAnimBtn').onclick=()=>{if(hwWriterInstance)hwWriterInstance.animateCharacter()};

  const cvs=modal.querySelector('#nbCanvas');
  initNotebookCanvas(cvs);setupCalligraphyBrush(cvs);
  const slider=modal.querySelector('#brushSlider'),preview=modal.querySelector('#brushPreview');
  slider.oninput=()=>{currentBrushWidth=parseInt(slider.value);preview.style.width=currentBrushWidth+'px';preview.style.height=currentBrushWidth+'px'};

  modal.querySelector('#nbShow').onclick=()=>{
    showExampleOnCanvas(cvs,renderChar);
    modal.querySelector('#nbShow').style.display='none';
    modal.querySelector('#nbHide').style.display='inline-block';
  };
  modal.querySelector('#nbHide').onclick=()=>{
    clearNotebookCanvas(cvs);
    modal.querySelector('#nbShow').style.display='inline-block';
    modal.querySelector('#nbHide').style.display='none';
  };
  modal.querySelector('#nbClear').onclick=()=>{
    clearNotebookCanvas(cvs);
    modal.querySelector('#qFill').style.width='0%';
    modal.querySelector('#qText').textContent='Нарисуй что-нибудь';
  };
  modal.querySelector('#nbCheck').onclick=()=>{
    const r=checkQuality(cvs);
    modal.querySelector('#qFill').style.width=r.score+'%';
    modal.querySelector('#qFill').style.background=r.color;
    modal.querySelector('#qText').textContent=r.msg;
  };

  modal.querySelector('.radical-big').onclick=()=>speakChinese(renderChar);
  modal.querySelectorAll('.example-word').forEach(el=>{el.onclick=()=>speakChinese(el.dataset.char)});

  modal.querySelector('#nbClose').onclick=()=>{modal.remove();currentModal=null;hwWriterInstance=null;pendingWord=null};
  modal.querySelector('#nbAdd').onclick=()=>{
    const ok=addToCopybookOnly(word.char,word.pinyin,word.meaning);
    showToast(ok?`✅ "${word.char}" в тетради!`:`⚠️ Уже есть`);
  };
  modal.onclick=e=>{if(e.target===modal){modal.remove();currentModal=null;hwWriterInstance=null;pendingWord=null}};

  speakChinese(renderChar);
}

/* ===== ИНИЦИАЛИЗАЦИЯ ===== */
function initGame(){
  let pairs;
  if(currentLevel === 'all'){
    pairs = getAllPairsForGame();
  } else {
    pairs = getAllPairsForLevel(currentLevel);
  }
  // Ограничиваем игру разумным количеством пар за раунд
  const MAX_PAIRS = 20;
  if(pairs.length > MAX_PAIRS){
    pairs = shuffleArr([...pairs]).slice(0, MAX_PAIRS);
  }

  if(!pairs.length){
    msgEl.textContent='❌ Нет данных. Проверьте dictionary-data.js и файлы радикалов';
    dbStatus.textContent='❌ База пуста';
    return;
  }

  totalPairs=pairs.length;
  matchedCount=0;score=0;streak=0;selectedId=null;pendingWord=null;
  tiles=[];

  let id=0;
  pairs.forEach((p,i)=>{
    tiles.push({
      id:id++,pairId:i,type:'key',
      char:p.keyChar,pinyin:p.keyPinyin,name:p.keyMeaning,
      keyChar:p.keyChar,removed:false
    });
    tiles.push({
      id:id++,pairId:i,type:'word',
      char:p.wordChar,pinyin:p.wordPinyin,name:p.wordMeaning,
      keyChar:p.keyChar,
      wordData:{char:p.wordChar,pinyin:p.wordPinyin,meaning:p.wordMeaning},
      removed:false
    });
  });

  shuffleArr(tiles);
  updateUI();
  renderGrid();
  startTimer();
  msgEl.textContent=`🎮 Найди ${totalPairs} пар: ключ ↔ слово`;
  dbStatus.textContent=`🎮 В игре: ${totalPairs} пар`;
}

/* ===== РЕНДЕР ===== */
function renderGrid(){
  if(!gridEl)return;
  gridEl.innerHTML='';
  for(const t of tiles){
    if(t.removed)continue;
    const d=document.createElement('div');
    d.className='tile'+(selectedId===t.id?' selected':'');
    const badge=t.type==='word'?'📖':'🔑';
    d.innerHTML=`
      <div class="tile-badge">${badge}</div>
      <div class="main-char">${t.char}</div>
      <div class="pinyin">${t.pinyin||''}</div>
      <div class="info">${t.name||(t.type==='word'?'слово':'ключ')}</div>
      <div class="sound-badge">🔊</div>
    `;
    d.querySelector('.sound-badge').addEventListener('click',e=>{
      e.stopPropagation();speakChinese(t.char);
    });
    d.addEventListener('click',e=>{
      if(e.target.classList.contains('sound-badge'))return;
      speakChinese(t.char);
      onTileClick(t,e);
    });
    gridEl.appendChild(d);
  }
}

/* ===== КЛИК ===== */
function onTileClick(clicked,event){
  if(clicked.removed)return;

  if(selectedId===null){
    selectedId=clicked.id;
    renderGrid();
    msgEl.textContent=`✅ Выбрано: ${clicked.char} (${clicked.type==='word'?'слово':'ключ'})`;
    return;
  }

  const sel=tiles.find(t=>t.id===selectedId);
  if(!sel){selectedId=null;return}

  if(sel.id===clicked.id){
    selectedId=null;renderGrid();
    msgEl.textContent='🔍 Снято';
    return;
  }

  if(sel.type===clicked.type){
    msgEl.textContent='⚠️ Нужно выбрать ключ и слово (разные типы)';
    selectedId=null;renderGrid();
    return;
  }

  if(sel.pairId===clicked.pairId){
    const wordTile=sel.type==='word'?sel:clicked;
    sel.removed=true;clicked.removed=true;
    matchedCount++;streak++;

    let points=10+Math.floor(streak/2)*2;
    const sp=calcSpeedBonus();
    points+=sp.bonus;
    if(sp.label&&event){
      const r=event.target.getBoundingClientRect();
      showFloatingBonus(sp.label,r.left+r.width/2-30,r.top-20);
    }
    score+=points;
    if(streak>record)record=streak;

    selectedId=null;
    updateUI();
    renderGrid();

    if(wordTile.wordData){
      const wd={...wordTile.wordData,keyChar:wordTile.keyChar};
      const isNew=addToCopybookOnly(wd.char,wd.pinyin,wd.meaning);
      pendingWord=wd;
      showLearnModal(wd,isNew);
    }

    msgEl.textContent=`✅ +${points}${sp.bonus>0?' ⚡':''} (🔥${streak})`;

    if(matchedCount===totalPairs){
      stopTimer();
      msgEl.textContent='🏆 УРОВЕНЬ ПРОЙДЕН!';
      speakChinese('恭喜你');
    }
  }else{
    streak=0;
    updateUI();
    msgEl.textContent=`❌ ${sel.char} ≠ ${clicked.char}. Попробуй ещё!`;
    selectedId=null;
    renderGrid();
  }
}

/* ===== UI ===== */
function updateUI(){
  if(scoreSpan)scoreSpan.textContent=score;
  if(remainSpan)remainSpan.textContent=totalPairs-matchedCount;
  if(streakSpan)streakSpan.textContent=streak;
  if(recordSpan)recordSpan.textContent=record;
  if(progressFill&&totalPairs>0)progressFill.style.width=((matchedCount/totalPairs)*100)+'%';
}

/* ===== ДЕЙСТВИЯ ===== */
function shuffleTiles(){
  if(!tiles.length){initGame();return}
  const rem=tiles.filter(t=>!t.removed);
  const rm=tiles.filter(t=>t.removed);
  shuffleArr(rem);
  tiles=[...rem,...rm];
  selectedId=null;
  renderGrid();
  msgEl.textContent='🃏 Перемешано!';
}
function showHint(){
  const active=tiles.filter(t=>!t.removed);
  for(let i=0;i<active.length;i++){
    for(let j=i+1;j<active.length;j++){
      if(active[i].pairId===active[j].pairId&&active[i].type!==active[j].type){
        msgEl.textContent=`💡 "${active[i].char}" ↔ "${active[j].char}"`;
        const nodes=gridEl.querySelectorAll('.tile');
        let idx=0;
        for(const t of tiles){
          if(t.removed)continue;
          if(t.id===active[i].id||t.id===active[j].id){
            if(nodes[idx]){
              nodes[idx].style.borderColor='#f7b42c';
              nodes[idx].style.boxShadow='0 0 0 4px rgba(247,180,44,.5),0 5px 0 #8b6946';
            }
          }
          idx++;
        }
        setTimeout(()=>renderGrid(),2000);
        return;
      }
    }
  }
  msgEl.textContent='💡 Все пары найдены!';
}

/* ===== СОБЫТИЯ ===== */
document.querySelectorAll('.level-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentLevel=btn.dataset.level;
    initGame();
  };
});
document.getElementById('hintBtn').onclick=showHint;
document.getElementById('shuffleBtn').onclick=shuffleTiles;
document.getElementById('resetGameBtn').onclick=()=>initGame();

/* ===== СТАРТ ===== */
window.addEventListener('load',()=>{
  const wait=setInterval(()=>{
    if((typeof HSK_DICT!=='undefined' && Object.keys(CHAR_RADICAL).length>0) || performance.now()>3000){
      clearInterval(wait);
      let totalAvailable = 0;
      ['hsk1','hsk2','hsk3','hsk4','hsk5','hsk6','hsk6_chars'].forEach(lv=>{
        totalAvailable += getAllPairsForLevel(lv).length;
      });
      dbStatus.textContent=`📚 Доступно пар по всем уровням: ${totalAvailable}`;
      initGame();
    }
  },150);
});
</script>
