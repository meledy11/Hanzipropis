<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Тренажёр 漢字">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16835f">
  <title>Тренажёр каллиграфии · HSK 1-5</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%2316835f'/><text x='256' y='370' font-size='340' text-anchor='middle' fill='white' font-family='KaiTi,STKaiti,serif'>漢</text></svg>">
  <link rel="apple-touch-icon"
        href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%2316835f'/><text x='256' y='370' font-size='340' text-anchor='middle' fill='white' font-family='KaiTi,STKaiti,serif'>漢</text></svg>">

  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
  <script src="dictionary-data.js"></script>

  <style>
    :root {
      --ink: #1a1f2b;
      --muted: #6b7280;
      --line: #e2e6ee;
      --line-strong: #cbd2dd;
      --grid: #d9e0ea;
      --green: #16835f;
      --green-soft: #e6f4ef;
      --blue: #2563eb;
      --blue-soft: #eff4ff;
      --red: #d92d20;
      --gold: #d4a840;
      --bg: #f2f4f8;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding: 0 0 env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .topbar {
      position: sticky; top: 0; z-index: 30;
      width: 100%;
      padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
      background: rgba(255,255,255,0.94);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      backdrop-filter: saturate(180%) blur(14px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .back-btn {
      min-width: 42px; min-height: 42px;
      border: 1px solid var(--line); border-radius: 10px;
      background: #fff; font-size: 14px; padding: 0 12px;
      cursor: pointer; touch-action: manipulation;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      color: var(--ink); font-weight: 600;
      text-decoration: none;
    }
    .back-btn:active { background: #eef2f7; }
    .title {
      flex: 1;
      font-size: 15px; font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.2px;
      text-align: center;
    }
    .stats-mini {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      white-space: nowrap;
      min-width: 58px;
      text-align: right;
    }

    .trainer-wrap {
      width: 100%;
      max-width: 520px;
      padding: 14px 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .mode-btn {
      min-height: 50px;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      padding: 4px 6px;
      touch-action: manipulation;
      transition: all .12s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .mode-btn:active { background: #eef2f7; transform: scale(0.97); }
    .mode-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      box-shadow: 0 3px 10px rgba(22,131,95,0.35);
    }
    .mode-btn .mode-icon { font-size: 16px; line-height: 1; }
    .mode-btn .mode-label { font-size: 11px; line-height: 1; }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
    }
    .char-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .char-display {
      font-family: "KaiTi", "STKaiti", serif;
      font-size: 58px;
      line-height: 1;
      color: var(--ink);
      flex: 0 0 auto;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }
    .char-display:active { color: var(--green); }
    .char-meta { flex: 1; min-width: 0; }
    .char-pinyin {
      color: var(--red);
      font-size: 24px;
      font-weight: 800;
      line-height: 1.1;
    }
    .char-meaning {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }
    .char-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px dashed var(--line);
    }
    .streak {
      font-size: 13px;
      font-weight: 700;
      color: var(--red);
    }
    .category-info {
      font-size: 12px;
      color: var(--muted);
    }

    .instruction {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
      min-height: 18px;
    }

    .canvas-wrap {
      position: relative;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 8px;
      aspect-ratio: 1/1;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(15,23,42,0.06);
    }
    .canvas-wrap.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    .status-badge {
      position: absolute;
      top: 10px; right: 10px;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 700;
      z-index: 10;
    }
    .status-badge.new { background: #d9e0ea; color: #4a5568; }
    .status-badge.learning { background: #fde68a; color: #78350f; }
    .status-badge.due { background: #fecaca; color: #991b1b; animation: pulse 1.5s infinite; }
    .status-badge.mastered { background: #bbf7d0; color: #14532d; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    #hw-container { width: 100%; height: 100%; }
    #hw-container svg { display: block; }

    .progress-bar {
      width: 100%; height: 8px;
      background: #e2e6ee;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green), #4ecdc4);
      width: 0%;
      transition: width .3s ease-out;
    }

    .stats-row {
      display: flex;
      justify-content: space-around;
      background: #f7f9fc;
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
    }
    .stats-row .combo { color: var(--red); }

    .controls {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      gap: 8px;
    }
    .ctrl-btn {
      min-height: 50px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: var(--ink);
      transition: all .12s;
    }
    .ctrl-btn:active { background: #eef2f7; transform: scale(0.98); }
    .ctrl-btn.primary {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
      box-shadow: 0 4px 12px rgba(22,131,95,0.35);
    }
    .ctrl-btn.primary:active { background: #12694a; }

    .floating {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 28px;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 2px 10px rgba(0,0,0,0.25);
      pointer-events: none;
      opacity: 0;
      z-index: 100;
      white-space: nowrap;
    }
    .floating.show { animation: floatUp 1s ease-out forwards; }
    @keyframes floatUp {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      20% { opacity: 1; transform: translate(-50%, -60%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
    }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      max-width: 420px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal-head {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 2px dashed var(--line);
      margin-bottom: 12px;
    }
    .modal-char {
      font-family: "KaiTi", "STKaiti", serif;
      font-size: 56px;
      line-height: 1;
    }
    .modal-pinyin {
      color: var(--red);
      font-size: 22px;
      font-weight: 800;
      margin-top: 4px;
    }
    .modal-meaning {
      color: var(--muted);
      font-size: 14px;
      margin-top: 2px;
    }
    .modal-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .example-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f7f9fc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: all .12s;
    }
    .example-item:active { background: var(--green-soft); transform: scale(0.98); }
    .example-word {
      font-family: "KaiTi", "STKaiti", serif;
      font-size: 24px;
      line-height: 1.1;
      min-width: 70px;
    }
    .example-info { flex: 1; min-width: 0; }
    .example-pinyin {
      color: var(--red);
      font-weight: 700;
      font-size: 13px;
    }
    .example-meaning {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }
    .example-sentence {
      font-size: 12px;
      color: #6b7280;
      font-style: italic;
      padding: 4px 12px 8px;
      line-height: 1.5;
    }
    .modal-close {
      margin-top: 12px;
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-close:active { background: #12694a; }

    .progress-block {
      text-align: center;
      padding: 10px;
      background: #f7f9fc;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .progress-stars { font-size: 24px; letter-spacing: 3px; }
    .progress-info {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    .offline-badge {
      position: fixed;
      right: 12px;
      top: calc(12px + env(safe-area-inset-top));
      z-index: 40;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e7f8f7;
      color: #087976;
      font: 700 11px/1.4 system-ui;
      box-shadow: 0 4px 12px rgba(8,121,118,.18);
      display: none;
    }
    body.offline .offline-badge { display: block; }

    @media (min-width: 720px) {
      .char-display { font-size: 68px; }
      .char-pinyin { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="offline-badge">Офлайн-режим</div>

  <header class="topbar">
    <a class="back-btn" href="index.html" title="Назад">← Назад</a>
    <div class="title">✍️ Тренажёр</div>
    <div class="stats-mini" id="miniStats">🎯 0%</div>
  </header>

  <main class="trainer-wrap">

    <div class="mode-grid">
      <button class="mode-btn active" data-mode="1" type="button">
        <span class="mode-icon">1️⃣</span>
        <span class="mode-label">HSK 1</span>
      </button>
      <button class="mode-btn" data-mode="2" type="button">
        <span class="mode-icon">2️⃣</span>
        <span class="mode-label">HSK 2</span>
      </button>
      <button class="mode-btn" data-mode="3" type="button">
        <span class="mode-icon">3️⃣</span>
        <span class="mode-label">HSK 3</span>
      </button>
      <button class="mode-btn" data-mode="4" type="button">
        <span class="mode-icon">4️⃣</span>
        <span class="mode-label">HSK 4</span>
      </button>
      <button class="mode-btn" data-mode="due" type="button">
        <span class="mode-icon">🔄</span>
        <span class="mode-label">Повтор</span>
      </button>
      <button class="mode-btn" data-mode="weak" type="button">
        <span class="mode-icon">🎯</span>
        <span class="mode-label">Слабые</span>
      </button>
    </div>

    <div class="panel">
      <div class="char-row">
        <div class="char-display" id="charDisplay" title="Нажмите для озвучки">永</div>
        <div class="char-meta">
          <div class="char-pinyin" id="pinyinDisplay">yǒng</div>
          <div class="char-meaning" id="meaningDisplay">вечный</div>
        </div>
      </div>
      <div class="char-bottom">
        <div class="streak" id="streakDisplay">🔥 0 дней</div>
        <div class="category-info" id="categoryDisplay">HSK 1</div>
      </div>
    </div>

    <div class="instruction" id="instructionText">✍️ Обведите иероглиф по порядку черт</div>

    <div class="canvas-wrap" id="canvasWrap">
      <div class="status-badge new" id="charStatus">✨ НОВЫЙ</div>
      <div id="hw-container"></div>
      <div class="floating" id="floatingText"></div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="stats-row">
      <span>⭐ <span id="scoreDisplay">0</span></span>
      <span>🎯 <span id="accuracyDisplay">0%</span></span>
      <span class="combo" id="comboDisplay"></span>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="hintBtn" type="button" title="Подсказка">👁️</button>
      <button class="ctrl-btn primary" id="nextBtn" type="button">⏭️ Следующий</button>
      <button class="ctrl-btn" id="examplesBtn" type="button" title="Примеры">📖</button>
    </div>

  </main>

  <div class="modal-overlay" id="examplesModal">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-char" id="examplesChar">水</div>
        <div class="modal-pinyin" id="examplesPinyin">shuǐ</div>
        <div class="modal-meaning" id="examplesMeaning">вода</div>
      </div>
      <div class="modal-list" id="examplesList"></div>
      <button class="modal-close" id="examplesClose" type="button">Закрыть</button>
    </div>
  </div>

  <script src="trainer.js"></script>
</body>
</html>
